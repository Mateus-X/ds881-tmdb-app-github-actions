name: CI/CD Time G2M
on:
  push:
    branches: ["release"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Garantia de Qualidade (Testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Instalar dependências
        run: npm ci
      - name: Rodar testes
        run: npm test

  build-web:
    name: Build Web (Expo Export)
    runs-on: ubuntu-latest
    needs: test # Só faz o build se passar nos testes
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          
      - name: Instalar Dependências
        run: npm ci

      - name: Injetar Variáveis de Ambiente
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Executar Build Web
        run: npx expo export --platform web

      - name: Bypass Jekyll (Evita erro na pasta _expo)
        run: touch dist/.nojekyll

      - name: Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy-web:
    name: Deploy para GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web # Só faz o deploy se o build terminar com sucesso
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instala depend.
        run: npm ci
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Cria o .env
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      - name: Permissões
        run: chmod +x android/gradlew

      - name: Buid And.Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: APK Artefato Upload
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  create-release:
    needs: [build-android, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: Baixa apk
        uses: actions/download-artifact@v4
        with:
          name: app-release
      - name: Cria GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release Expo v${{ github.run_number }}
          files: app-release.apk
          body: "Build automático da aplicação Expo TMDB. Versão Web publicada no Pages."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}